<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蛋蛋龙 · 浮岛日记</title><link rel="stylesheet" href="style.css"></head><body>
<header class="pagehead"><a class="brand" href="#">蛋蛋龙 <small>浮岛日记</small></a><span>一颗小蛋，一段奇遇。</span><button id="help">玩法指南 ↗</button></header>
<main><div class="gamehead"><div><span class="eyebrow">MY LITTLE DRAGON WORLD</span><h1>欢迎回到你的浮岛</h1></div><div class="save" id="save">● 自动保存已开启</div></div>
<section class="game" aria-label="龙的家园"><div class="hud"><div class="level"><b id="level">1</b><span>饲养师<small id="xp">0 / 30 经验</small></span></div><div class="currency">✦ <b id="coins"></b><small>金币</small></div><div class="currency">♥ <b id="food"></b><small>食物</small></div><div class="hudright"><button id="daily">🎁 每日礼物</button><button id="shop">▣ 商店</button></div></div>
<div class="world" id="world"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="worldlabel" id="worldlabel"></div><div id="visitbadge" class="visitbadge"></div><div class="nestlabel">孵化花园 <small>点击空草台，放入一颗龙蛋</small></div><div id="nests" class="nests"></div><div class="ground"><div class="flowers">✿　·　✿　　　　　✿　　·　　　　　✿</div><div id="dragons"></div><div id="mess"></div></div><div class="worldhint">点击小龙，照顾你的新朋友</div></div>
<div class="toolbar"><button id="home" title="回到我的家园">⌂ 我的家</button><button id="bag">◈ 龙蛋背包 <small id="eggcount"></small></button><button id="collect">✦ 收取礼物</button><button id="album">▤ 图鉴</button><span id="count"></span></div>
<div class="scene-strip"><div><small>家园场景</small><b id="scene-name"></b></div><div id="scenes" class="scene-list"></div><span class="scene-note">8 个孵化位 · 固定</span></div>
<div class="friends-panel"><div class="friends-title"><div><span class="eyebrow">NEIGHBORHOOD</span><h2>好友家园 <small>本地演示</small></h2></div><span>去串门，帮小龙打扫一下吧</span></div><div id="friends" class="friend-list"></div></div></section>
<footer><span>✧ 慢慢长大，也是一种魔法。</span><span>本地单人原型 · 原创绘制素材 · 规则为演示设计</span></footer></main>
<dialog id="modal"><div class="modalhead"><h2 id="modaltitle"></h2><button id="close" aria-label="关闭">×</button></div><div id="modalbody"></div></dialog><div id="toast" role="status"></div><script src="game.js"></script></body></html>
